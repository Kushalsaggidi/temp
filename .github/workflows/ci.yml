name: ci

env:
  NEXT_TELEMETRY_DISABLED: "1"

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Reset deterministic local database
        run: npm run db:reset
      - name: Verify contracts, types, tests, and build
        run: npm run verify
